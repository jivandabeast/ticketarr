<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ticketarr">
  <title>ticketarr</title>
  <!-- Rounded ticket body -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect x="24" y="88" width="464" height="336" rx="40" ry="40" fill="url(#g)"/>
  <!-- Perforated separator -->
  <line x1="256" y1="120" x2="256" y2="392" stroke="#0f172a" stroke-width="6" stroke-dasharray="10 12" stroke-linecap="round"/>
  <!-- Left cutout -->
  <circle cx="24" cy="256" r="32" fill="#0f172a"/>
  <!-- Right cutout -->
  <circle cx="488" cy="256" r="32" fill="#0f172a"/>
  <!-- Left: film reel -->
  <g transform="translate(140 256)">
    <circle r="70" fill="none" stroke="#f8fafc" stroke-width="10"/>
    <circle r="14" fill="#f8fafc"/>
    <circle cx="0" cy="-42" r="10" fill="#f8fafc"/>
    <circle cx="0" cy="42" r="10" fill="#f8fafc"/>
    <circle cx="-42" cy="0" r="10" fill="#f8fafc"/>
    <circle cx="42" cy="0" r="10" fill="#f8fafc"/>
  </g>
  <!-- Right: play arrow -->
  <g transform="translate(372 256)">
    <path d="M -34 -46 L 44 0 L -34 46 Z" fill="#f8fafc"/>
  </g>
</svg>
