# ticketarr — sample configuration
#
# Copy this file to `config/config.yml` (mounted at /config/config.yml in the
# container) and edit. Any value can also be provided via environment variables
# (see README.md); env vars override the YAML values.

imap:
  host: imap.example.com
  port: 993
  username: you@example.com
  password: "app-password-here"
  mailbox: INBOX
  ssl: true
  # Leave empty to use the union of all registered parsers' senders
  # (e.g. AMC today, Regal in the future). Uncomment to override.
  # sender_filters:
  #   - AMCTheatres@amctheatres.com
  #   - no-reply@regmovies.com
  initial_lookback_days: 7
  poll_interval_seconds: 120
  mark_seen: true

tmdb:
  # Either api_key or bearer_token is required.
  api_key: your-tmdb-v3-api-key
  # bearer_token: your-tmdb-v4-read-access-token

# Which tracker to report watched movies to.
# One of: none, trakt, ryot, yamtrack
tracker:
  provider: trakt

# Optional: also send a "please add this" request for each reservation.
# One of: none, seerr, ombi
requester:
  provider: none

trakt:
  client_id: your-trakt-client-id
  client_secret: your-trakt-client-secret
  # Access/refresh tokens are populated automatically after the first device-flow login.
  token_path: /config/trakt_token.json

ryot:
  base_url: http://ryot:8000
  # Preferred: ticketarr calls Ryot's `loginUser` mutation at startup to
  # obtain a session token (same as the web UI). Ryot rejects requests that
  # don't carry a valid session token with `NO_USER_ID`, so simply pasting
  # a "master" api key does NOT work — you need real credentials, or an
  # access-link token issued via `processAccessLink`.
  username: your-ryot-username
  password: "your-ryot-password"
  # Advanced: uncomment and set this if you've generated an access-link
  # token instead of using username/password. Ignored when username +
  # password are set.
  # api_key: your-ryot-access-link-token
  # Fallback duration when TMDB doesn't know the movie's runtime; the
  # scrobble's finished-on timestamp is (showtime + this many minutes).
  # default_runtime_minutes: 120

yamtrack:
  base_url: http://yamtrack:8000
  # ticketarr drives Yamtrack's internal /media_save form (there is no
  # first-party REST API for creating watched-movie entries with a
  # specific timestamp). Provide the same credentials you use to log
  # into the web UI. This IS an unofficial contract — a future Yamtrack
  # upgrade could break it. See AGENTS.md for details.
  username: your-yamtrack-username
  password: "your-yamtrack-password"

seerr:
  # Works for both Jellyseerr and Overseerr.
  base_url: http://jellyseerr:5055
  api_key: your-seerr-api-key
  # Set to true to file 4K requests instead of standard-quality.
  request_4k: false

ombi:
  base_url: http://ombi:3579
  api_key: your-ombi-api-key
  language_code: en

state_path: /config/state.json
healthcheck_port: 8765
