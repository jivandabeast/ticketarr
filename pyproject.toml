[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketarr"
version = "0.1.0"
description = "Watch an inbox for AMC A-List emails and scrobble/request the movies to your services."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ticketarr contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "IMAPClient>=3.0",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Regal ticket OCR. Also requires the system `tesseract` binary to be
# on PATH (or pointed at via TESSERACT_CMD). The docker image installs
# these unconditionally; local users can `pip install ticketarr[ocr]`.
ocr = [
    "pytesseract>=0.3",
    "Pillow>=10.0",
]

[project.scripts]
ticketarr = "ticketarr.__main__:main"

[tool.setuptools.packages.find]
include = ["ticketarr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_mode = "auto"
